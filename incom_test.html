<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배달 일지 입력</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: auto; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>오늘의 배달 수입 기록</h2>

  <div class="form-group">
    <label for="workDate">날짜</label>
    <input type="date" id="workDate">
  </div>

  <div class="form-group">
    <label for="income">수입 금액 (원)</label>
    <input type="number" id="income" placeholder="예: 200000">
  </div>

  <button onclick="sendData()">구글 시트로 전송</button>

  <script>
    // 오늘 날짜 기본 세팅
    document.getElementById('workDate').value = new Date().toISOString().substring(0, 10);

    function sendData() {
      // 1단계에서 얻은 구글 웹앱 URL을 입력
      const GAS_URL = "https://script.google.com/macros/s/AKfycbxXdtqrRyocgvwnhu1cWxKVbT9f3jD3lAUxr9xzO9AxAzvPE1h_osQWwXuzPlNQ2qWA/exec";

      const date = document.getElementById('workDate').value;
      const amount = document.getElementById('income').value;

      if (!amount) {
        alert("금액을 입력해!");
        return;
      }

      // 수집 항목 생성
      const payload = {
        date: date,
        amount: amount,
        userAgent: navigator.userAgent,                                      // 기기 및 브라우저 정보
        resolution: `${window.screen.width}x${window.screen.height}`,         // 화면 해상도 (예: 390x844)
        language: navigator.language || navigator.userLanguage,              // 언어 (예: ko-KR)
        timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,          // 타임존 (예: Asia/Seoul)
        referrer: document.referrer || "직접 접속 (Direct)"                   // 유입 경로
      };

      fetch(GAS_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8',
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("전송 완료!");
        document.getElementById('income').value = '';
      })
      .catch(error => {
        console.error("에러 발생:", error);
        alert("전송 실패");
      });
    }
  </script>
</body>
</html>
