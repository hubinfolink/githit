<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자율 설정 복리 계산기</title>
    <link rel="stylesheet" href="style.css">
  <!-- 메뉴 공통 스크립트 연결 -->
  <script src="menu.js"></script>
</head>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00e676;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --input-bg: #2a2a2a;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 850px;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }
        h2 {
            margin-top: 0;
            color: var(--accent-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }
        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        .input-group label {
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #aaa;
        }
        .input-wrapper {
            display: flex;
            gap: 5px;
        }
        input, select {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            border-color: var(--accent-color);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .summary-card {
            margin-top: 25px;
            background-color: var(--input-bg);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        .summary-item {
            display: flex;
            flex-direction: column;
        }
        .summary-item .title {
            font-size: 0.8rem;
            color: #888;
        }
        .summary-item .value {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 4px;
        }
        .summary-item .value.highlight {
            color: var(--accent-color);
        }
        /* 테이블 컨테이너 내부 스크롤바 제거 및 전체 표시 설정 */
        .table-container {
            margin-top: 20px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: 0.85rem;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background-color: #252525;
            color: #ccc;
            text-align: right;
        }
        th:first-child, td:first-child {
            text-align: center;
        }
    </style>
</head>
<body>

<!-- 상단 메뉴 자리 -->
  <nav class="cell-nav"></nav>
   <br> 
<div class="container">
    <h2>맞춤형 복리 수익 계산기</h2>

    <div class="input-grid">
        <div class="input-group">
            <label for="principal">초기 원금 (원)</label>
            <input type="text" id="principal" value="1,000,000" oninput="formatCurrencyInput(this)">
        </div>

        <div class="input-group">
            <label>적용 이율 (%)</label>
            <div class="input-wrapper">
                <input type="number" id="rateVal" value="10" step="0.01">
                <select id="rateUnit">
                    <option value="year" selected>연이율</option>
                    <option value="month">월이율</option>
                    <option value="day">일이율</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label>복리 적용 주기</label>
            <div class="input-wrapper">
                <input type="number" id="compoundVal" value="1" min="1">
                <select id="compoundUnit">
                    <option value="day">일 단위</option>
                    <option value="month">개월 단위</option>
                    <option value="year">년 단위</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label>총 투자 기간</label>
            <div class="input-wrapper">
                <input type="number" id="periodVal" value="1" min="1">
                <select id="periodUnit">
                    <option value="year" selected>년</option>
                    <option value="month">개월</option>
                    <option value="day">일</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label>상세 결과 출력 단위</label>
            <select id="displayUnit">
                <option value="day">일별 표시</option>
                <option value="month" selected>월별 표시</option>
                <option value="year">연별 표시</option>
            </select>
        </div>
    </div>

    <button onclick="calculate()">시뮬레이션 실행</button>

    <div id="summary" class="summary-card" style="display: none;">
        <div class="summary-item">
            <span class="title">최종 원리금</span>
            <span class="value highlight" id="sumFinalBalance">0 원</span>
        </div>
        <div class="summary-item">
            <span class="title">총 수익금</span>
            <span class="value" id="sumTotalProfit">0 원</span>
        </div>
        <div class="summary-item">
            <span class="title">최종 수익률</span>
            <span class="value highlight" id="sumROI">0 %</span>
        </div>
    </div>

    <div class="table-container" id="tableContainer" style="display: none;">
        <table>
            <thead>
                <tr>
                    <th id="thPeriod">회차</th>
                    <th>누적 원금</th>
                    <th>당기 수익</th>
                    <th>누적 수익금</th>
                    <th>총 잔액</th>
                    <th>누적 수익률</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

<script>
function formatCurrencyInput(input) {
    let value = input.value.replace(/[^0-9]/g, '');
    if (value) {
        input.value = parseInt(value, 10).toLocaleString();
    } else {
        input.value = '';
    }
}

function toFormattedString(num) {
    return Math.round(num).toLocaleString();
}

function calculate() {
    const rawPrincipal = document.getElementById('principal').value.replace(/,/g, '');
    const principal = parseFloat(rawPrincipal);

    const rateVal = parseFloat(document.getElementById('rateVal').value);
    const rateUnit = document.getElementById('rateUnit').value;

    const compoundVal = parseInt(document.getElementById('compoundVal').value);
    const compoundUnit = document.getElementById('compoundUnit').value;

    const periodVal = parseInt(document.getElementById('periodVal').value);
    const periodUnit = document.getElementById('periodUnit').value;

    const displayUnit = document.getElementById('displayUnit').value;

    if (isNaN(principal) || isNaN(rateVal) || principal <= 0) {
        alert('올바른 투자금액과 이율을 입력하십시오.');
        return;
    }

    let dailyRate = 0;
    const baseRate = rateVal / 100;

    if (rateUnit === 'day') {
        dailyRate = baseRate;
    } else if (rateUnit === 'month') {
        dailyRate = baseRate / 30;
    } else if (rateUnit === 'year') {
        dailyRate = baseRate / 365;
    }

    let totalDays = 0;
    if (periodUnit === 'day') totalDays = periodVal;
    else if (periodUnit === 'month') totalDays = periodVal * 30;
    else if (periodUnit === 'year') totalDays = periodVal * 365;

    let compoundDays = 0;
    if (compoundUnit === 'day') compoundDays = compoundVal;
    else if (compoundUnit === 'month') compoundDays = compoundVal * 30;
    else if (compoundUnit === 'year') compoundDays = compoundVal * 365;

    let currentBalance = principal;
    let accumulatedInterest = 0;
    const dailyRecords = [];

    for (let day = 1; day <= totalDays; day++) {
        const todaysInterest = currentBalance * dailyRate;
        accumulatedInterest += todaysInterest;

        if (day % compoundDays === 0 || day === totalDays) {
            currentBalance += accumulatedInterest;
            accumulatedInterest = 0;
        }

        dailyRecords.push({
            day: day,
            balance: currentBalance + accumulatedInterest
        });
    }

    let displayInterval = 1;
    let periodLabel = '일';
    if (displayUnit === 'month') {
        displayInterval = 30;
        periodLabel = '개월';
    } else if (displayUnit === 'year') {
        displayInterval = 365;
        periodLabel = '년';
    }

    const tbody = document.getElementById('resultBody');
    tbody.innerHTML = '';
    document.getElementById('thPeriod').innerText = `경과 (${periodLabel})`;

    let prevBalance = principal;

    for (let i = displayInterval - 1; i < dailyRecords.length; i += displayInterval) {
        const record = dailyRecords[i];
        const step = Math.floor((i + 1) / displayInterval);
        const totalProfit = record.balance - principal;
        const periodProfit = record.balance - prevBalance;
        const roi = (totalProfit / principal) * 100;

        const row = `<tr>
            <td>${step} ${periodLabel}</td>
            <td>${toFormattedString(principal)} 원</td>
            <td style="color: #00e676;">+${toFormattedString(periodProfit)} 원</td>
            <td>${toFormattedString(totalProfit)} 원</td>
            <td>${toFormattedString(record.balance)} 원</td>
            <td>${roi.toFixed(2)} %</td>
        </tr>`;
        tbody.innerHTML += row;
        prevBalance = record.balance;
    }

    const finalBalance = dailyRecords[dailyRecords.length - 1].balance;
    const finalProfit = finalBalance - principal;
    const finalROI = (finalProfit / principal) * 100;

    document.getElementById('sumFinalBalance').innerText = `${toFormattedString(finalBalance)} 원`;
    document.getElementById('sumTotalProfit').innerText = `${toFormattedString(finalProfit)} 원`;
    document.getElementById('sumROI').innerText = `${finalROI.toFixed(2)} %`;

    document.getElementById('summary').style.display = 'grid';
    document.getElementById('tableContainer').style.display = 'block';
}
</script>

<!-- 하단 메뉴 자리 -->
  <nav class="cell-nav-bottom"></nav>

  <!-- 메뉴 자동 삽입 스크립트 (맨 아래 배치) -->
  <script src="menu.js"></script>

</body>
</html>    
</body>
</html>
