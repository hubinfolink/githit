<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Analytics - Floating Top Boss</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .table-container { overflow-x: auto; scrollbar-width: thin; scrollbar-color: #475569 #1e293b; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th.thumb-col { padding: 0; }
        th { background: #1e293b; position: sticky; top: 0; z-index: 10; padding: 4px 2px; text-align: center; font-size: 0.8em; }
        td.thumb-cell { padding: 0; height: 60px; }
        td { border-bottom: 1px solid #334155; padding: 4px; vertical-align: middle; }
        .sortable-header { cursor: pointer; transition: color 0.2s; white-space: nowrap; }
        .sortable-header:hover { color: #f87171; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        .quick-btn { transition: all 0.2s; font-weight: 900; }
        .quick-btn:active { scale: 0.95; }
        /* 스크롤 버튼의 스무스한 애니메이션 */
        .top-btn { position: fixed; bottom: 20px; right: 20px; z-index: 100; transition: all 0.3s; }
        .top-btn:hover { transform: translateY(-5px); }

        /* API Key UI: 2. KR 옆자리 배치 및 4. 우측 정렬 */
        .key-input-wrapper { transition: all 0.3s; width: 0; opacity: 0; overflow: hidden; display: flex; align-items: center; }
        .key-input-wrapper.open { width: 220px; opacity: 1; margin-right: 8px; }
        .api-key-exposed {
            text-align: right; /* 4. 뒷자리 확인을 위한 우측 정렬 */
            direction: ltr;
            padding-right: 8px;
            color: #34d399; /* Emerald-400 */
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans selection:bg-red-500">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        /* ==========================================
           Configuration (Boss's Hierarchy)
           ========================================== */
        const DEFAULT_API_KEY = 'AIzaSyBBOrShpnWuTF-W2dfJI1AorYJhORtW0z4';
        const BOSS_FONT_SIZE = '18px'; // 보스의 가독성을 위한 18px
        /* ========================================== */

        const REGIONS = [{ code: 'KR', name: 'KR' }, { code: 'US', name: 'US' }, { code: 'JP', name: 'JP' }, { code: 'GB', name: 'UK' }];
        const CATEGORIES = [{ id: '0', name: '전체' }, { id: '25', name: '뉴스/정치' }, { id: '27', name: '교육' }, { id: '10', name: '음악' }, { id: '20', name: '게임' }, { id: '17', name: '스포츠' }, { id: '24', name: '엔터' }];

        const Icon = ({ name, className }) => {
            const icons = {
                Search: <><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>,
                TrendingUp: <><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></>,
                Loader2: <><path d="M21 12a9 9 0 1 1-6.219-8.56"/></>,
                Copy: <><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></>,
                ArrowUp: <><polyline points="18 15 12 9 6 15"/><line x1="12" x2="12" y1="15" y2="3"/></>,
                Key: <><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.778-7.778Zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3-3.5 3.5Z"/></>
            };
            return <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name]}</svg>;
        };

        function App() {
            // LocalStorage 연동 및 3. API 키 노출 설정
            const [apiKey, setApiKey] = useState(localStorage.getItem('BOSS_YT_KEY') || DEFAULT_API_KEY);
            const [isKeyOpen, setIsKeyOpen] = useState(false);

            const [videos, setVideos] = useState([]);
            const [loading, setLoading] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [trendRegion, setTrendRegion] = useState('KR');
            const [trendCategory, setTrendCategory] = useState('0');
            const [videoType, setVideoType] = useState('medium');
            const [sortConfig, setSortConfig] = useState({ key: 'vps', direction: 'desc' });

            const [startDate, setStartDate] = useState(new Date().toISOString().split('T')[0]);
            const [endDate, setEndDate] = useState(new Date().toISOString().split('T')[0]);
            const [activePeriod, setActivePeriod] = useState('오늘');

            const setQuickDate = (label, days) => {
                const now = new Date();
                let start = label === '전체' ? '2005-01-01' : new Date(now.getTime() - days * 86400000).toISOString().split('T')[0];
                setStartDate(start);
                setEndDate(now.toISOString().split('T')[0]);
                setActivePeriod(label);
            };

            const fetchData = async (type, overrideQuery = null) => {
                if (!apiKey) return alert('보스, API 키부터 제대로 이식해.');
                setLoading(true);
                setVideos([]);
                try {
                    let items = [];
                    const finalQuery = overrideQuery || searchQuery;

                    let url = type === 'trends'
                        ? `https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&chart=mostPopular&regionCode=${trendRegion}&maxResults=30&key=${apiKey}${trendCategory !== '0' ? `&videoCategoryId=${trendCategory}` : ''}`
                        : `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&q=${encodeURIComponent(finalQuery)}&maxResults=30&key=${apiKey}${videoType !== 'any' ? `&videoDuration=${videoType}` : ''}&publishedAfter=${new Date(startDate).toISOString()}&publishedBefore=${new Date(endDate + 'T23:59:59Z').toISOString()}`;

                    const res = await fetch(url);
                    const data = await res.json();

                    // 1. 에러 시 상세 메시지 출력
                    if (data.error) {
                        const err = data.error.errors?.[0] || {};
                        throw new Error(`[${err.reason}] ${data.error.message}`);
                    }

                    items = data.items || [];
                    if (type === 'search' && items.length > 0) {
                        const vIds = items.map(i => i.id.videoId).join(',');
                        const vRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${vIds}&key=${apiKey}`);
                        const vData = await vRes.json();
                        if (vData.error) throw new Error(vData.error.message);
                        items = vData.items || [];
                    }

                    if (items.length > 0) {
                        const chIds = [...new Set(items.map(i => i.snippet.channelId))].join(',');
                        const chData = await (await fetch(`https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${chIds}&key=${apiKey}`)).json();
                        const chMap = {};
                        chData.items?.forEach(c => chMap[c.id] = c.statistics.subscriberCount);

                        setVideos(items.map(item => {
                            const v = parseInt(item.statistics.viewCount || 0);
                            const l = parseInt(item.statistics.likeCount || 0);
                            const s = parseInt(chMap[item.snippet.channelId] || 0);
                            const h = (new Date() - new Date(item.snippet.publishedAt)) / 3600000;
                            return { ...item, vDate: item.snippet.publishedAt, subs: s, views: v, vph: Math.round(v / Math.max(h, 1)), lRate: v > 0 ? parseFloat(((l / v) * 100).toFixed(2)) : 0, vps: s > 0 ? Math.round((v / s) * 100) : 0 };
                        }));
                    }
                } catch (e) {
                    alert(`🚨 Boss, Error Report:\n${e.message}`); // 1. 에러 메시지 팝업
                }
                setLoading(false);
            };

            const saveApiKey = (val) => {
                const cleaned = val.trim();
                setApiKey(cleaned);
                localStorage.setItem('BOSS_YT_KEY', cleaned);
            };

            const handleCopyTitles = () => {
                if (videos.length === 0) return alert('보스, 복사할 데이터가 없어.');
                navigator.clipboard.writeText(videos.map(v => v.snippet.title).join('\n')).then(() => alert(`${videos.length}개의 제목 복사 완료.`));
            };

            const scrollToTop = () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const sortedVideos = useMemo(() => {
                let list = [...videos];
                if (sortConfig.key) {
                    list.sort((a, b) => {
                        const av = sortConfig.key === 'vDate' ? new Date(a[sortConfig.key]) : a[sortConfig.key];
                        const bv = sortConfig.key === 'vDate' ? new Date(b[sortConfig.key]) : b[sortConfig.key];
                        return sortConfig.direction === 'asc' ? (av > bv ? 1 : -1) : (av < bv ? 1 : -1);
                    });
                }
                return list;
            }, [videos, sortConfig]);

            return (
                <div style={{ fontSize: BOSS_FONT_SIZE }} className="min-h-screen p-3 max-w-[1500px] mx-auto animate-fade-in relative">

                    {/* Floating Top Button */}
                    <button
                        onClick={scrollToTop}
                        className="top-btn bg-red-600 hover:bg-red-700 text-white p-4 rounded-full shadow-2xl active:scale-90 flex items-center justify-center transition-all border-2 border-white/20"
                        title="최상단으로"
                    >
                        <Icon name="ArrowUp" />
                    </button>

                    <header className="bg-slate-800/90 p-2 rounded-xl border border-slate-700 flex flex-wrap items-center gap-2 mb-2 shadow-md">

                        {/* 2. API 등록 버튼 (KR 옆자리) 및 3. 키 노출, 4. 우측 정렬 */}
                        <div className="flex items-center bg-slate-900 border border-slate-700 rounded-lg p-1">
                            <button onClick={() => setIsKeyOpen(!isKeyOpen)} className={`p-1.5 rounded-md transition-all ${apiKey ? 'bg-emerald-600/20 text-emerald-400' : 'bg-red-600 text-white animate-pulse'}`}>
                                <Icon name="Key" />
                            </button>
                            <div className={`key-input-wrapper ${isKeyOpen ? 'open' : ''}`}>
                                <input
                                    type="text"
                                    className="api-key-exposed bg-slate-800 border border-slate-700 rounded px-2 py-0.5 text-xs w-full focus:outline-none focus:border-blue-500 font-mono"
                                    placeholder="Paste API Key..."
                                    value={apiKey}
                                    onChange={(e) => saveApiKey(e.target.value)}
                                />
                            </div>
                        </div>

                        <select value={trendRegion} onChange={e => setTrendRegion(e.target.value)} className="bg-slate-900 border border-slate-700 rounded px-2 py-1 font-bold text-blue-400 focus:outline-none">{REGIONS.map(r => <option key={r.code} value={r.code}>{r.name}</option>)}</select>
                        <select value={trendCategory} onChange={e => setTrendCategory(e.target.value)} className="bg-slate-900 border border-slate-700 rounded px-1 py-0.5 font-bold text-blue-400 focus:outline-none">{CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select>




                        <div className="flex flex-wrap gap-1">
                            {['뉴스', '이슈', '트럼프', '살해', '사망', '영어단어', '명언', '경제학', '건강정보', '심리학', 'Psychology'].map(label => (
                                <button key={label} onClick={() => { setSearchQuery(label); setQuickDate('1주일', 7); setSortConfig({ key: 'views', direction: 'desc' }); fetchData('search', label); }} className="quick-btn bg-slate-700 hover:bg-blue-600 text-white px-3 py-1 rounded-lg text-[0.7em] shadow-sm">{label}</button> //'오늘', 0 asc
                            ))}
                        </div>

                        <button onClick={() => fetchData('trends')} className="ml-auto bg-red-600 hover:bg-red-700 text-white px-4 py-1.5 rounded-lg font-black text-[0.8em] flex items-center gap-1 active:scale-95 shadow-md"><Icon name="TrendingUp" /> 트렌드 분석</button>
                    </header>

                    <div className="bg-slate-800/60 p-3 rounded-xl border border-slate-700 shadow-lg mb-2">
                        <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                            <div className="flex bg-slate-900 p-0.5 rounded-xl border border-slate-700">
                                {['short', 'medium', 'any'].map(v => (
                                    <button key={v} onClick={() => setVideoType(v)} className={`px-4 py-1 rounded-lg font-black transition-all text-[0.7em] ${videoType === v ? 'bg-red-600 text-white shadow-lg' : 'text-slate-500'}`}>{v === 'short' ? '숏폼' : v === 'medium' ? '롱폼' : '모두'}</button>
                                ))}
                            </div>
                            <div className="flex gap-1">
                                {[{ l: '오늘', d: 0 }, { l: '1주일', d: 7 }, { l: '1개월', d: 30 }, { l: '전체', d: null }].map(p => (
                                    <button key={p.l} onClick={() => setQuickDate(p.l, p.d)} className={`px-3 py-1 rounded-lg text-[0.7em] font-bold ${activePeriod === p.l ? 'bg-slate-200 text-slate-900 shadow-md' : 'bg-slate-700 text-slate-400'}`}>{p.l}</button>
                                ))}
                            </div>
                        </div>
                        <div className="flex gap-2 items-center">
                            <input type="text" className="flex-1 bg-slate-900 border border-slate-700 text-slate-100 rounded-xl px-4 py-2 focus:outline-none focus:ring-1 focus:ring-red-600 font-bold" placeholder="Keywords..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} onKeyDown={e => e.key === 'Enter' && fetchData('search')} />
                            <button onClick={() => fetchData('search')} className="bg-red-600 hover:bg-red-700 text-white px-8 py-2 rounded-xl font-black shadow-lg transition-all active:scale-95">검색</button>
                            <button onClick={handleCopyTitles} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl font-black shadow-lg active:scale-95 transition-all flex items-center gap-2"><Icon name="Copy" /> 제목 카피</button>
                        </div>
                    </div>

                    <div className="table-container bg-slate-800/40 rounded-2xl border border-slate-700 overflow-hidden shadow-2xl mb-20">
                        <table>
                            <thead>
                                <tr className="text-slate-500 uppercase font-black border-b border-slate-700 bg-slate-800/80">
                                    <th className="w-24 thumb-col">THUMB</th>
                                    <th className="w-[180px] text-left px-2">VIDEO / CHANNEL</th>
                                    <th onClick={() => setSortConfig({key: 'vDate', direction: sortConfig.direction === 'desc' ? 'asc' : 'desc'})} className="sortable-header w-14">DATE</th>
                                    <th onClick={() => setSortConfig({key: 'vps', direction: sortConfig.direction === 'desc' ? 'asc' : 'desc'})} className="sortable-header text-orange-400 bg-orange-500/5 w-12">VPS</th>
                                    <th onClick={() => setSortConfig({key: 'vph', direction: sortConfig.direction === 'desc' ? 'asc' : 'desc'})} className="sortable-header text-blue-400 w-12">VPH</th>
                                    <th onClick={() => setSortConfig({key: 'subs', direction: sortConfig.direction === 'desc' ? 'asc' : 'desc'})} className="sortable-header w-16">SUBS</th>
                                    <th onClick={() => setSortConfig({key: 'views', direction: sortConfig.direction === 'desc' ? 'asc' : 'desc'})} className="sortable-header w-16">VIEWS</th>
                                    <th onClick={() => setSortConfig({key: 'lRate', direction: sortConfig.direction === 'desc' ? 'asc' : 'desc'})} className="sortable-header text-green-400 w-12">LIKE%</th>
                                </tr>
                            </thead>
                            <tbody>
                                {sortedVideos.map(v => (
                                    <tr key={v.id} className="hover:bg-slate-700/40 transition-colors border-slate-700/50">
                                        <td className="p-0 height-[50px]"><a href={`https://youtu.be/${v.id}`} target="_blank" className="block w-full h-full"><img src={v.snippet.thumbnails.medium?.url} className="w-full h-full object-cover" /></a></td>
                                        <td className="px-2 leading-tight">
                                            <div className="font-black text-slate-100 line-clamp-2 text-[0.9em] mb-1">{v.snippet.title}</div>
                                            <div className="text-[0.65em] text-slate-500 font-black truncate uppercase opacity-60 tracking-tighter">{v.snippet.channelTitle}</div>
                                        </td>
                                        <td className="text-slate-400 font-mono text-center opacity-70 text-[0.7em]">{v.vDate.split('T')[0].slice(2)}</td>
                                        <td className="text-orange-400 font-black bg-orange-500/5 text-center text-[0.8em]">{v.vps}%</td>
                                        <td className="font-mono text-blue-400 font-black text-center text-[0.8em]">{v.vph}</td>
                                        <td className="text-slate-300 text-center font-bold text-[0.7em]">{v.subs.toLocaleString()}</td>
                                        <td className="font-black text-slate-100 text-center text-[0.8em]">{v.views.toLocaleString()}</td>
                                        <td className="text-green-400 font-black text-center text-[0.8em]">{v.lRate}%</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                        {!loading && videos.length === 0 && <div className="p-10 text-center text-slate-600 font-black italic text-sm">Wait for Command, Boss.</div>}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
