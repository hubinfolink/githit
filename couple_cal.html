<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>프로모션 시급 & 총수익 계산기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Touch Device Active States & Smooth Scrolling */
        body {
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for small screen heights */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-3 sm:p-5 select-none">

    <div class="max-w-md w-full mx-auto space-y-4">

        <!-- Header -->
        <header class="text-center pt-2 pb-1">
            <div class="inline-flex items-center gap-2 bg-slate-800/80 border border-slate-700/60 px-3 py-1 rounded-full text-xs text-brand-500 font-semibold mb-1 shadow-sm">
                <span class="w-2 h-2 rounded-full bg-brand-500 animate-pulse"></span>
                실시간 수익 계산기
            </div>
            <h1 class="text-xl font-bold tracking-tight text-white">라이더 프로모션 시급 계산기</h1>
            <p class="text-xs text-slate-400 mt-0.5">시간, 건수, 금액을 입력하면 시급과 총수익을 계산합니다.</p>
        </header>

        <!-- Input Form Section -->
        <section class="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-4 shadow-xl backdrop-blur-sm space-y-3.5">
            <div class="grid grid-cols-2 gap-3">
                <!-- Working Hours -->
                <div>
                    <label for="hours" class="block text-xs font-semibold text-slate-300 mb-1.5 flex items-center gap-1">
                        ⏱️ 작업 시간
                    </label>
                    <div class="relative">
                        <input type="number" id="hours" value="3" step="any" min="0" placeholder="0"
                            class="w-full bg-slate-900/90 border border-slate-700 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 text-right text-lg font-bold text-white rounded-xl py-2.5 pl-3 pr-8 transition-all outline-none">
                        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-medium text-slate-400 pointer-events-none">시간</span>
                    </div>
                </div>

                <!-- Delivery Count -->
                <div>
                    <label for="count" class="block text-xs font-semibold text-slate-300 mb-1.5 flex items-center gap-1">
                        📦 배달 건수
                    </label>
                    <div class="relative">
                        <input type="number" id="count" value="10" min="0" placeholder="0"
                            class="w-full bg-slate-900/90 border border-slate-700 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 text-right text-lg font-bold text-white rounded-xl py-2.5 pl-3 pr-8 transition-all outline-none">
                        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-medium text-slate-400 pointer-events-none">건</span>
                    </div>
                </div>
            </div>

            <!-- Base Amount -->
            <div>
                <label for="baseAmount" class="block text-xs font-semibold text-slate-300 mb-1.5 flex items-center gap-1">
                    💰 기본 금액
                </label>
                <div class="relative">
                    <input type="text" id="baseAmount" value="35,000" inputmode="numeric" placeholder="0"
                        class="w-full bg-slate-900/90 border border-slate-700 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 text-right text-xl font-extrabold text-brand-500 rounded-xl py-2.5 pl-3 pr-8 transition-all outline-none">
                    <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-medium text-slate-400 pointer-events-none">원</span>
                </div>
            </div>

            <!-- Quick Input Reset/Preset Helper Buttons -->
            <div class="flex items-center justify-between text-xs pt-1 border-t border-slate-700/50">
                <span class="text-slate-400">빠른 초기화</span>
                <button id="resetBtn" class="text-xs text-slate-400 hover:text-white bg-slate-700/50 hover:bg-slate-700 px-2.5 py-1 rounded-lg transition-colors flex items-center gap-1 active:scale-95">
                    🔄 값 비우기
                </button>
            </div>
        </section>

        <!-- Result Display Section -->
        <section class="space-y-2.5">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">프로모션별 예상 수익</h2>
                <span class="text-[11px] text-slate-500">실시간 자동 계산됨</span>
            </div>

            <div id="resultsContainer" class="space-y-2.5">
                <!-- Result Cards generated dynamically via JavaScript -->
            </div>
        </section>

    </div>

    <footer class="text-center text-[11px] text-slate-500 mt-6 pb-2">
        라이더 맞춤형 수익 계산기 &bull; 화면 분할 모드 최적화
    </footer>

    <script>
        // Promo Constants
        const PROMO_DATA = [
            { id: 'p200', name: '프로모200', rate: 1000 },
            { id: 'p250', name: '프로모250', rate: 1300 },
            { id: 'p300', name: '프로모300', rate: 1600 },
            { id: 'p350', name: '프로모350', rate: 1800 },
            { id: 'p400', name: '프로모400', rate: 2000 },
        ];

        // DOM Elements
        const hoursInput = document.getElementById('hours');
        const countInput = document.getElementById('count');
        const baseAmountInput = document.getElementById('baseAmount');
        const resultsContainer = document.getElementById('resultsContainer');
        const resetBtn = document.getElementById('resetBtn');

        // Helper: Format Number with commas
        function formatNumber(num) {
            if (isNaN(num) || num === null || num === undefined) return '0';
            return Math.round(num).toLocaleString('ko-KR');
        }

        // Helper: Parse Number from comma string
        function parseFormattedNumber(str) {
            if (!str) return 0;
            const cleaned = str.toString().replace(/[^0-9]/g, '');
            return parseInt(cleaned, 10) || 0;
        }

        // Handle Base Amount Input Formatting (Comma addition while typing)
        baseAmountInput.addEventListener('input', (e) => {
            let cursorPosition = e.target.selectionStart;
            let rawValue = parseFormattedNumber(e.target.value);

            if (rawValue === 0 && e.target.value.trim() === '') {
                e.target.value = '';
            } else {
                e.target.value = rawValue.toLocaleString('ko-KR');
            }

            calculateAndRender();
        });

        // Trigger Calculation on Input Changes
        hoursInput.addEventListener('input', calculateAndRender);
        countInput.addEventListener('input', calculateAndRender);

        // Reset Button Handler
        resetBtn.addEventListener('click', () => {
            hoursInput.value = '';
            countInput.value = '';
            baseAmountInput.value = '';
            calculateAndRender();
            hoursInput.focus();
        });

        function calculateAndRender() {
            const hours = parseFloat(hoursInput.value) || 0;
            const count = parseInt(countInput.value, 10) || 0;
            const baseAmount = parseFormattedNumber(baseAmountInput.value);

            let cardsHTML = '';

            PROMO_DATA.forEach((promo) => {
                // Formula: Total Revenue = Base Amount + (Delivery Count * Promo Rate)
                const totalIncome = baseAmount + (count * promo.rate);

                // Formula: Hourly Wage = Math.round(Total Revenue / Hours)
                let hourlyWage = 0;
                if (hours > 0) {
                    hourlyWage = Math.round(totalIncome / hours);
                }

                const hourlyWageText = hours > 0 ? `${formatNumber(hourlyWage)}원` : '-';
                const totalIncomeText = `${formatNumber(totalIncome)}원`;

                cardsHTML += `
                    <div class="bg-slate-800/60 border border-slate-700/70 hover:border-slate-600 rounded-xl p-3.5 shadow-md transition-all">
                        <!-- Top Row: Name & Unit Price -->
                        <div class="flex items-center justify-between pb-2 mb-2.5 border-b border-slate-700/40">
                            <div class="flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-brand-500"></span>
                                <span class="font-bold text-sm text-slate-100">${promo.name}</span>
                            </div>
                            <span class="text-xs text-slate-400 bg-slate-900/60 px-2 py-0.5 rounded-md border border-slate-700/50">
                                건당 +${formatNumber(promo.rate)}원
                            </span>
                        </div>

                        <!-- Bottom Grid: Hourly Wage & Total Revenue -->
                        <div class="grid grid-cols-2 gap-2 text-right">
                            <div class="bg-slate-900/50 p-2 rounded-lg border border-slate-800">
                                <div class="text-[11px] font-medium text-slate-400 mb-0.5 text-left">시급</div>
                                <div class="text-base font-extrabold ${hours > 0 ? 'text-amber-400' : 'text-slate-500'} tracking-tight">
                                    ${hourlyWageText}
                                </div>
                            </div>
                            <div class="bg-slate-900/50 p-2 rounded-lg border border-slate-800">
                                <div class="text-[11px] font-medium text-slate-400 mb-0.5 text-left">총수익</div>
                                <div class="text-base font-extrabold text-brand-500 tracking-tight">
                                    ${totalIncomeText}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            resultsContainer.innerHTML = cardsHTML;
        }

        // Initial Calculation Run on Page Load
        window.addEventListener('DOMContentLoaded', () => {
            calculateAndRender();
        });
    </script>
</body>
</html>
