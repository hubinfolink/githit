<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>라이더 프로모션 계산기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        inputBg: '#0f172a',
                        accentGreen: '#10b981',
                        accentBlue: '#3b82f6',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            font-size: 22px; /* 기본 글자 크기 22px */
        }
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        .text-size-btn {
            touch-action: manipulation;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen pb-8 flex flex-col items-center">

    <!-- 메인 컨테이너 -->
    <div class="w-full max-w-lg px-3 pt-3 pb-6 flex flex-col gap-3">

        <!-- 입력 영역 카드 -->
        <div class="bg-cardBg rounded-2xl p-4 border border-slate-800 shadow-xl flex flex-col gap-3">

            <!-- 카드 상단 (글자 크기 조절 / 타이틀 / 값 비우기) -->
            <div class="flex items-center justify-between border-b border-slate-700/60 pb-3 gap-1">

                <!-- 글자 크기 조절 버튼 (+/-) -->
                <div class="flex items-center bg-slate-900/90 rounded-xl p-1 border border-slate-700/80 shadow-inner">
                    <button id="btnFontDec" class="text-size-btn w-8 h-8 flex items-center justify-center rounded-lg bg-slate-800 text-slate-200 hover:bg-slate-700 active:bg-slate-600 transition text-sm font-bold active:scale-95">
                        <i class="fa-solid font-bold">-</i>
                    </button>
                    <span id="fontSizeDisplay" class="text-xs font-bold px-2 text-emerald-400 min-w-[3rem] text-center select-none">
                        22px
                    </span>
                    <button id="btnFontInc" class="text-size-btn w-8 h-8 flex items-center justify-center rounded-lg bg-slate-800 text-slate-200 hover:bg-slate-700 active:bg-slate-600 transition text-sm font-bold active:scale-95">
                        <i class="fa-solid font-bold">+</i>
                    </button>
                </div>

                <!-- 타이틀 -->
                <div class="flex items-center gap-1.5 font-bold text-base text-slate-100 min-w-0">
                    <span class="text-lg">✏️</span>
                    <span class="truncate">데이터 입력</span>
                </div>

                <!-- 값 비우기 버튼 -->
                <button id="resetBtn" class="flex items-center gap-1.5 text-xs bg-slate-800/90 hover:bg-slate-700 text-slate-300 hover:text-white px-2.5 py-2 rounded-xl transition border border-slate-700 active:scale-95 whitespace-nowrap">
                    <i class="fa-solid fa-rotate-right text-emerald-400"></i>
                    <span class="font-medium">비우기</span>
                </button>
            </div>

            <!-- 입력 폼 그리드 -->
            <div class="grid grid-cols-2 gap-3 pt-1">
                <!-- 작업 시간 -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
                        <span>⏱️</span> 작업 시간
                    </label>
                    <div class="relative flex items-center">
                        <input type="number" id="inputHours" step="0.1" min="0" placeholder="0"
                            class="w-full bg-inputBg border border-slate-700 rounded-xl px-3 py-2.5 text-right font-bold text-lg text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition pr-10">
                        <span class="absolute right-3 text-xs text-slate-400 pointer-events-none font-medium">시간</span>
                    </div>
                </div>

                <!-- 배달 건수 -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
                        <span>📦</span> 배달 건수
                    </label>
                    <div class="relative flex items-center">
                        <input type="number" id="inputCount" step="1" min="0" placeholder="0"
                            class="w-full bg-inputBg border border-slate-700 rounded-xl px-3 py-2.5 text-right font-bold text-lg text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition pr-8">
                        <span class="absolute right-3 text-xs text-slate-400 pointer-events-none font-medium">건</span>
                    </div>
                </div>
            </div>

            <!-- 금액 및 미션 입력 -->
            <div class="grid grid-cols-1 gap-3">
                <!-- 기본 금액 -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
                        <span>💰</span> 기본 금액
                    </label>
                    <div class="relative flex items-center">
                        <input type="number" id="inputBaseAmount" step="100" min="0" placeholder="0"
                            class="w-full bg-inputBg border border-slate-700 rounded-xl px-3 py-2.5 text-right font-bold text-lg text-emerald-400 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition pr-8">
                        <span class="absolute right-3 text-xs text-slate-400 pointer-events-none font-medium">원</span>
                    </div>
                </div>

                <!-- 미션 금액 -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-semibold text-amber-300 flex items-center gap-1.5">
                        <span>🎯</span> 미션 금액
                    </label>
                    <div class="relative flex items-center">
                        <input type="number" id="inputMissionAmount" step="100" min="0" placeholder="0"
                            class="w-full bg-inputBg border border-slate-700 rounded-xl px-3 py-2.5 text-right font-bold text-lg text-amber-300 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition pr-8">
                        <span class="absolute right-3 text-slate-400 text-xs pointer-events-none font-medium">원</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- 요약 문구 & 복사 카드 -->
        <div class="bg-cardBg rounded-2xl p-4 border border-slate-800 shadow-xl flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
                    <span>📋</span> 요약 텍스트
                </span>
                <span class="text-[10px] text-slate-400">선택한 프로모션 기준</span>
            </div>

            <!-- 프로모션 탭 선택 (P400 ~ P0) -->
            <div class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs no-scrollbar" id="promoTabs">
                <button data-promo-idx="0" class="promo-tab-btn px-2.5 py-1 rounded-lg bg-emerald-600 text-white font-semibold transition shrink-0 active:scale-95">P400(57)</button>
                <button data-promo-idx="1" class="promo-tab-btn px-2.5 py-1 rounded-lg bg-slate-800 text-slate-400 font-semibold transition shrink-0 active:scale-95">P350(50)</button>
                <button data-promo-idx="2" class="promo-tab-btn px-2.5 py-1 rounded-lg bg-slate-800 text-slate-400 font-semibold transition shrink-0 active:scale-95">P300(43)</button>
                <button data-promo-idx="3" class="promo-tab-btn px-2.5 py-1 rounded-lg bg-slate-800 text-slate-400 font-semibold transition shrink-0 active:scale-95">P250(36)</button>
                <button data-promo-idx="4" class="promo-tab-btn px-2.5 py-1 rounded-lg bg-slate-800 text-slate-400 font-semibold transition shrink-0 active:scale-95">P200(29)</button>
                <button data-promo-idx="5" class="promo-tab-btn px-2.5 py-1 rounded-lg bg-slate-800 text-slate-400 font-semibold transition shrink-0 active:scale-95">P0</button>
            </div>

            <!-- 요약 문구 결과 박스 -->
            <div class="bg-slate-900/90 rounded-xl p-3 border border-slate-700/80 flex items-center justify-between gap-2">
                <div id="summaryText" class="text-sm font-semibold text-slate-100 tracking-wide select-all break-all">
                    총 0시간, 총수익 0원, 총 0건, 0.0건/h, 시급 0원, 건당 0원
                </div>
                <button id="copyBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg font-bold text-xs flex items-center gap-1.5 shrink-0 active:scale-95 transition shadow-lg shadow-emerald-950">
                    <i class="fa-regular fa-copy"></i>
                    <span>복사</span>
                </button>
            </div>
        </div>

        <!-- 계산 결과 표 카드 -->
        <div class="bg-cardBg rounded-2xl p-4 border border-slate-800 shadow-xl">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-bold text-slate-200 flex items-center gap-1.5">
                    <span>📊</span> 프로모션별 비교표
                </h2>
                <span class="text-[11px] text-slate-400">단가 / 시급 / 총수익</span>
            </div>

            <!-- 결과 테이블 -->
            <div class="overflow-hidden rounded-xl border border-slate-700/60">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-900/80 text-slate-400 text-xs border-b border-slate-700/80">
                            <th class="py-2.5 px-3 font-semibold">프로모션</th>
                            <th class="py-2.5 px-2 font-semibold text-right">단가</th>
                            <th class="py-2.5 px-2 font-semibold text-right">시급</th>
                            <th class="py-2.5 px-3 font-semibold text-right">총수익</th>
                        </tr>
                    </thead>
                    <tbody id="resultTableBody" class="divide-y divide-slate-800/80 text-sm">
                        <!-- JS Dynamic Rendering -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- 복사 완료 토스트 알림 -->
    <div id="toast" class="fixed bottom-6 bg-emerald-500 text-slate-950 px-4 py-2.5 rounded-xl font-bold text-sm shadow-2xl transition-all duration-300 transform translate-y-16 opacity-0 flex items-center gap-2 pointer-events-none z-50">
        <i class="fa-solid fa-check"></i>
        <span>클립보드에 복사되었습니다!</span>
    </div>

    <script>
        // 프로모션 기본 데이터 (P0 추가)
        const promoList = [
            { name: 'P400(57)', unitRate: 2000 },
            { name: 'P350(50)', unitRate: 1800 },
            { name: 'P300(43)', unitRate: 1600 },
            { name: 'P250(36)', unitRate: 1300 },
            { name: 'P200(29)', unitRate: 1000 },
            { name: 'P0', unitRate: 0 }
        ];

        // 기본 상태
        let currentPromoIndex = 0;
        let currentFontSize = parseInt(localStorage.getItem('rider_font_size')) || 22;

        // DOM 요소
        const inputHours = document.getElementById('inputHours');
        const inputCount = document.getElementById('inputCount');
        const inputBaseAmount = document.getElementById('inputBaseAmount');
        const inputMissionAmount = document.getElementById('inputMissionAmount');
        const resultTableBody = document.getElementById('resultTableBody');
        const summaryText = document.getElementById('summaryText');
        const resetBtn = document.getElementById('resetBtn');
        const copyBtn = document.getElementById('copyBtn');
        const toast = document.getElementById('toast');
        const promoTabs = document.getElementById('promoTabs');

        // Font Size Controls
        const btnFontDec = document.getElementById('btnFontDec');
        const btnFontInc = document.getElementById('btnFontInc');
        const fontSizeDisplay = document.getElementById('fontSizeDisplay');

        // 초기화 함수
        function init() {
            applyFontSize(currentFontSize);

            // 초기 예시 데이터 세팅
            inputHours.value = 3;
            inputCount.value = 10;
            inputBaseAmount.value = 35000;
            inputMissionAmount.value = '';

            // 이벤트 리스너 바인딩
            [inputHours, inputCount, inputBaseAmount, inputMissionAmount].forEach(input => {
                input.addEventListener('input', calculateAll);
            });

            resetBtn.addEventListener('click', resetInputs);
            copyBtn.addEventListener('click', copySummaryToClipboard);

            btnFontDec.addEventListener('click', () => changeFontSize(-1));
            btnFontInc.addEventListener('click', () => changeFontSize(1));

            // 탭 클릭 이벤트
            promoTabs.addEventListener('click', (e) => {
                const btn = e.target.closest('.promo-tab-btn');
                if (!btn) return;
                currentPromoIndex = parseInt(btn.dataset.promoIdx);
                updateTabsUI();
                calculateAll();
            });

            calculateAll();
        }

        // 폰트 크기 변경 함수
        function changeFontSize(delta) {
            currentFontSize = Math.max(14, Math.min(32, currentFontSize + delta));
            applyFontSize(currentFontSize);
            localStorage.setItem('rider_font_size', currentFontSize);
        }

        function applyFontSize(size) {
            document.documentElement.style.fontSize = size + 'px';
            fontSizeDisplay.textContent = size + 'px';
        }

        // 탭 UI 업데이트
        function updateTabsUI() {
            const buttons = promoTabs.querySelectorAll('.promo-tab-btn');
            buttons.forEach((btn, idx) => {
                if (idx === currentPromoIndex) {
                    btn.className = 'promo-tab-btn px-2.5 py-1 rounded-lg bg-emerald-600 text-white font-semibold transition shrink-0 active:scale-95';
                } else {
                    btn.className = 'promo-tab-btn px-2.5 py-1 rounded-lg bg-slate-800 text-slate-400 font-semibold transition shrink-0 active:scale-95';
                }
            });
        }

        // 계산 및 화면 업데이트
        function calculateAll() {
            const hours = parseFloat(inputHours.value) || 0;
            const count = parseFloat(inputCount.value) || 0;
            const baseAmount = parseFloat(inputBaseAmount.value) || 0;
            const missionAmount = parseFloat(inputMissionAmount.value) || 0;

            resultTableBody.innerHTML = '';

            let selectedSummary = '';

            promoList.forEach((promo, idx) => {
                // 프로모션 추가 수익 = 건수 * 단가
                const promoEarnings = count * promo.unitRate;

                // 총 수익 = 기본금액 + 미션금액 + 프로모션수익
                const totalIncome = baseAmount + missionAmount + promoEarnings;

                // 시급 = 총수익 / 시간 (반올림)
                const hourlyRate = hours > 0 ? Math.round(totalIncome / hours) : 0;

                // 건당 평균 단가 = 총수익 / 건수 (반올림)
                const perCountRate = count > 0 ? Math.round(totalIncome / count) : 0;

                const isSelected = idx === currentPromoIndex;

                // 행 생성
                const tr = document.createElement('tr');
                tr.className = isSelected
                    ? 'bg-emerald-950/40 text-emerald-300 font-semibold border-b border-slate-800'
                    : 'hover:bg-slate-800/40 border-b border-slate-800/60 text-slate-200';

                tr.innerHTML = `
                    <td class="py-3 px-3">
                        <span class="font-bold">${promo.name}</span>
                    </td>
                    <td class="py-3 px-2 text-right text-xs text-slate-400">
                        ${promo.unitRate.toLocaleString()}원
                    </td>
                    <td class="py-3 px-2 text-right font-bold text-amber-300">
                        ${hourlyRate.toLocaleString()}원
                    </td>
                    <td class="py-3 px-3 text-right font-bold text-emerald-400">
                        ${totalIncome.toLocaleString()}원
                    </td>
                `;

                resultTableBody.appendChild(tr);

                // 선택된 프로모션의 요약 문구 생성 (총시간, 총수익 맨 앞에 추가)
                if (isSelected) {
                    const countPerHour = hours > 0 ? (count / hours).toFixed(1) : '0.0';
                    selectedSummary = `총 ${hours}시간, 총수익 ${totalIncome.toLocaleString()}원, 총 ${count.toLocaleString()}건, ${countPerHour}건/h, 시급 ${hourlyRate.toLocaleString()}원, 건당 ${perCountRate.toLocaleString()}원`;
                }
            });

            summaryText.textContent = selectedSummary;
        }

        // 입력값 초기화
        function resetInputs() {
            inputHours.value = '';
            inputCount.value = '';
            inputBaseAmount.value = '';
            inputMissionAmount.value = '';
            calculateAll();
            inputHours.focus();
        }

        // 복사 기능
        function copySummaryToClipboard() {
            const textToCopy = summaryText.textContent.trim();
            if (!textToCopy) return;

            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast();
            }).catch(() => {
                // Clipboard API 실패 시 대체
                const textarea = document.createElement('textarea');
                textarea.value = textToCopy;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast();
            });
        }

        // 토스트 알림
        function showToast() {
            toast.classList.remove('translate-y-16', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-16', 'opacity-0');
            }, 2000);
        }

        // 실행
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
