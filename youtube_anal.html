<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YT Analytics Floating Player</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .settings-panel { transition: max-height 0.3s ease, opacity 0.3s ease; max-height: 0; opacity: 0; overflow: hidden; }
        .settings-panel.open { max-height: 180px; opacity: 1; margin-bottom: 12px; }
        .quick-btn { transition: all 0.15s; }
        .quick-btn:active { transform: scale(0.95); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans selection:bg-red-500 pb-16">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const BASE_FONT_SIZE = '20px';
        const DEFAULT_API_KEY = 'AIzaSyBBOrShpnWuTF-W2dfJI1AorYJhORtW0z4';
        const REGIONS = [{ code: 'KR', name: 'KR' }, { code: 'US', name: 'US' }, { code: 'JP', name: 'JP' }, { code: 'GB', name: 'UK' }];
        const CATEGORIES = [
            { id: '0', name: '전체' }, { id: '25', name: '뉴스' }, { id: '27', name: '교육' },
            { id: '10', name: '음악' }, { id: '20', name: '게임' }, { id: '17', name: '스포츠' }, { id: '24', name: '엔터' }
        ];

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                Search: <><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>,
                TrendingUp: <><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></>,
                ArrowUp: <><polyline points="18 15 12 9 6 15"/><line x1="12" x2="12" y1="15" y2="3"/></>,
                Settings: <><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>,
                X: <><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>,
                ExternalLink: <><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></>
            };
            return <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name]}</svg>;
        };

        function App() {
            const [apiKey, setApiKey] = useState(localStorage.getItem('BOSS_YT_KEY') || DEFAULT_API_KEY);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [videos, setVideos] = useState([]);
            const [loading, setLoading] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [trendRegion, setTrendRegion] = useState('KR');
            const [trendCategory, setTrendCategory] = useState('0');
            const [videoType, setVideoType] = useState('medium');

            // 선택된 영상의 ID 및 타입(숏폼/롱폼) 관리
            const [selectedVideo, setSelectedVideo] = useState(null);

            const todayStr = new Date().toISOString().split('T')[0];
            const [startDate, setStartDate] = useState(todayStr);
            const [endDate, setEndDate] = useState(todayStr);
            const [activePeriod, setActivePeriod] = useState('오늘');

            const setQuickDate = (label, days) => {
                const now = new Date();
                let start = label === '전체' ? '2005-01-01' : new Date(now.getTime() - days * 86400000).toISOString().split('T')[0];
                setStartDate(start);
                setEndDate(now.toISOString().split('T')[0]);
                setActivePeriod(label);
            };

            const fetchData = async (type, overrideQuery = null) => {
                if (!apiKey) return alert('보스, API 키부터 등록해.');
                setLoading(true);
                setVideos([]);
                try {
                    let items = [];
                    const finalQuery = overrideQuery || searchQuery;

                    let url = type === 'trends'
                        ? `https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&chart=mostPopular&regionCode=${trendRegion}&maxResults=30&key=${apiKey}${trendCategory !== '0' ? `&videoCategoryId=${trendCategory}` : ''}`
                        : `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&q=${encodeURIComponent(finalQuery)}&maxResults=30&key=${apiKey}${videoType !== 'any' ? `&videoDuration=${videoType}` : ''}&publishedAfter=${new Date(startDate).toISOString()}&publishedBefore=${new Date(endDate + 'T23:59:59Z').toISOString()}`;

                    const res = await fetch(url);
                    const data = await res.json();

                    if (data.error) {
                        const err = data.error.errors?.[0] || {};
                        throw new Error(`[${err.reason}] ${data.error.message}`);
                    }

                    items = data.items || [];
                    if (type === 'search' && items.length > 0) {
                        const vIds = items.map(i => i.id.videoId).join(',');
                        const vRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${vIds}&key=${apiKey}`);
                        const vData = await vRes.json();
                        if (vData.error) throw new Error(vData.error.message);
                        items = vData.items || [];
                    }

                    const parsedList = items.map(item => ({
                        id: item.id.videoId || item.id,
                        title: item.snippet.title,
                        channelTitle: item.snippet.channelTitle,
                        thumb: item.snippet.thumbnails.high?.url || item.snippet.thumbnails.medium?.url,
                        vDate: item.snippet.publishedAt.split('T')[0],
                        views: parseInt(item.statistics?.viewCount || 0)
                    })).sort((a, b) => b.views - a.views);

                    setVideos(parsedList);
                } catch (e) {
                    alert(`🚨 Boss Error:\n${e.message}`);
                }
                setLoading(false);
            };

            const saveApiKey = (val) => {
                const cleaned = val.trim();
                setApiKey(cleaned);
                localStorage.setItem('BOSS_YT_KEY', cleaned);
            };

            const scrollToTop = () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            return (
                <div style={{ fontSize: BASE_FONT_SIZE }} className="w-full min-h-screen relative leading-relaxed">

                    <header className="bg-slate-900 p-3 border-b border-slate-800">
                        <div className={`settings-panel ${isSettingsOpen ? 'open' : ''}`}>
                            <div className="bg-slate-800/80 p-3 rounded-2xl border border-slate-700 space-y-2">
                                <div className="text-[0.75em] font-bold text-slate-400">시스템 설정</div>
                                <input
                                    type="text"
                                    className="bg-slate-900 border border-slate-700 rounded-xl p-2 text-emerald-400 font-mono w-full text-[0.8em] focus:outline-none"
                                    placeholder="Paste API Key..."
                                    value={apiKey}
                                    onChange={(e) => saveApiKey(e.target.value)}
                                />
                                <div className="flex gap-2 pt-1">
                                    <div className="flex-1">
                                        <label className="block text-[0.7em] text-slate-400 font-bold mb-1">트렌드 국가</label>
                                        <select value={trendRegion} onChange={e => setTrendRegion(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-1.5 font-bold text-blue-400 focus:outline-none text-[0.8em]">
                                            {REGIONS.map(r => <option key={r.code} value={r.code}>{r.name}</option>)}
                                        </select>
                                    </div>
                                    <div className="flex-1">
                                        <label className="block text-[0.7em] text-slate-400 font-bold mb-1">카테고리</label>
                                        <select value={trendCategory} onChange={e => setTrendCategory(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-1.5 font-bold text-blue-400 focus:outline-none text-[0.8em]">
                                            {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="flex overflow-x-auto gap-2 no-scrollbar pb-2.5 mb-2.5 border-b border-slate-800">
                            <button
                                onClick={() => fetchData('trends')}
                                className="quick-btn shrink-0 bg-red-600 text-white px-3 py-1.5 rounded-xl font-black flex items-center gap-1 active:scale-95 shadow"
                            >
                                <Icon name="TrendingUp" className="w-5 h-5" /> 트렌드
                            </button>
                            {['뉴스', '이슈', '트럼프', '살해', '사망', '영어단어', '명언', '경제학', '건강정보', '심리학'].map(label => (
                                <button
                                    key={label}
                                    onClick={() => { setSearchQuery(label); setQuickDate('오늘', 0); fetchData('search', label); }}
                                    className="quick-btn shrink-0 bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl font-bold border border-slate-700/50"
                                >
                                    {label}
                                </button>
                            ))}
                        </div>

                        <div className="flex items-center justify-between gap-2 mb-2.5">
                            <div className="flex bg-slate-800 p-1 rounded-xl border border-slate-700 shrink-0">
                                {['short', 'medium', 'any'].map(v => (
                                    <button
                                        key={v}
                                        onClick={() => setVideoType(v)}
                                        className={`px-3 py-1 rounded-lg font-black transition-all ${videoType === v ? 'bg-red-600 text-white shadow' : 'text-slate-400'}`}
                                    >
                                        {v === 'short' ? '숏폼' : v === 'medium' ? '롱폼' : '모두'}
                                    </button>
                                ))}
                            </div>

                            <div className="flex gap-1 shrink-0">
                                {[{ l: '오늘', d: 0 }, { l: '1주일', d: 7 }, { l: '1개월', d: 30 }, { l: '전체', d: null }].map(p => (
                                    <button
                                        key={p.l}
                                        onClick={() => setQuickDate(p.l, p.d)}
                                        className={`px-2.5 py-1 rounded-lg font-bold ${activePeriod === p.l ? 'bg-slate-200 text-slate-900' : 'bg-slate-800 text-slate-400 border border-slate-700/50'}`}
                                    >
                                        {p.l}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="flex gap-2">
                            <input
                                type="text"
                                className="w-full bg-slate-800 border border-slate-700 text-slate-100 rounded-xl px-3 py-2 focus:outline-none focus:border-red-500 font-bold"
                                placeholder="검색어 입력..."
                                value={searchQuery}
                                onChange={e => setSearchQuery(e.target.value)}
                                onKeyDown={e => e.key === 'Enter' && fetchData('search')}
                            />
                            <button onClick={() => fetchData('search')} className="bg-red-600 active:bg-red-700 text-white px-4 py-2 rounded-xl font-black active:scale-95 shrink-0 shadow">
                                검색
                            </button>
                            <button
                                onClick={() => setIsSettingsOpen(!isSettingsOpen)}
                                className={`px-3 py-2 rounded-xl font-black active:scale-95 shrink-0 shadow border transition-colors ${isSettingsOpen ? 'bg-slate-200 text-slate-900 border-white' : 'bg-slate-800 text-slate-300 border-slate-700'}`}
                            >
                                <Icon name="Settings" className="w-6 h-6" />
                            </button>
                        </div>
                    </header>

                    <main className="w-full divide-y divide-slate-800/80">
                        {loading && (
                            <div className="py-20 text-center text-slate-400 font-bold">
                                로딩 중...
                            </div>
                        )}

                        {!loading && videos.length === 0 && (
                            <div className="py-20 text-center text-slate-500 font-bold">
                                Wait for Command, Boss.
                            </div>
                        )}

                        {!loading && videos.map((v, index) => (
                            <div key={v.id} className="bg-slate-900 w-full active:bg-slate-800/50 transition-colors pb-4">

                                <div
                                    onClick={() => setSelectedVideo({ id: v.id, isShort: videoType === 'short' })}
                                    className="relative block w-full aspect-video bg-slate-950 overflow-hidden cursor-pointer"
                                >
                                    <img src={v.thumb} className="w-full h-full object-cover" alt="thumb" />

                                    <span className="absolute top-2 left-2 bg-black/80 text-amber-400 font-black px-2.5 py-1 rounded-lg text-[0.8em] border border-amber-400/30 shadow">
                                        #{index + 1}
                                    </span>

                                    <span className="absolute bottom-2 right-2 bg-red-600/90 text-white font-black px-3 py-1 rounded-xl text-[0.85em] shadow-lg border border-red-400/30">
                                        {v.views.toLocaleString()}회
                                    </span>
                                </div>

                                <div className="px-3 pt-3 space-y-1.5">
                                    <div
                                        onClick={() => setSelectedVideo({ id: v.id, isShort: videoType === 'short' })}
                                        className="font-black text-slate-100 line-clamp-2 leading-snug text-[0.95em] cursor-pointer"
                                    >
                                        {v.title}
                                    </div>

                                    <div className="flex items-center justify-between text-[0.8em] text-slate-400 font-bold pt-1">
                                        <span className="truncate max-w-[200px] text-slate-300">{v.channelTitle}</span>
                                        <div className="flex items-center gap-2">
                                            <span className="text-slate-500 font-mono">{v.vDate}</span>
                                            <a
                                                href={`https://www.youtube.com/watch?v=${v.id}&autoplay=1`}
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                className="text-slate-400 hover:text-white p-1"
                                                title="새 창으로 열기"
                                            >
                                                <Icon name="ExternalLink" className="w-4 h-4" />
                                            </a>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        ))}
                    </main>

                    {/* 플로팅 팝업 모달 플레이어 (숏폼 및 롱폼 반응형 극대화) */}
                    {selectedVideo && (
                        <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col justify-center items-center p-0 sm:p-2 animate-fade-in">
                            <div className={`w-full bg-slate-900 border border-slate-700 rounded-none sm:rounded-2xl overflow-hidden shadow-2xl flex flex-col ${selectedVideo.isShort ? 'max-w-md h-full max-h-[90vh]' : 'max-w-3xl h-auto'}`}>

                                <div className="flex justify-between items-center px-4 py-2.5 bg-slate-800 border-b border-slate-700 shrink-0">
                                    <span className="font-bold text-[0.85em] text-slate-300">
                                        {selectedVideo.isShort ? '📱 Shorts Player' : '🎬 Player'}
                                    </span>
                                    <button
                                        onClick={() => setSelectedVideo(null)}
                                        className="p-1 bg-slate-700 hover:bg-slate-600 rounded-lg text-slate-200"
                                    >
                                        <Icon name="X" className="w-6 h-6" />
                                    </button>
                                </div>

                                <div className={`relative w-full bg-black flex-1 ${selectedVideo.isShort ? 'aspect-[9/16]' : 'aspect-video'}`}>
                                    <iframe
                                        src={`https://www.youtube.com/embed/${selectedVideo.id}?autoplay=1`}
                                        title="YouTube video player"
                                        className="w-full h-full border-0"
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                        allowFullScreen
                                    ></iframe>
                                </div>

                            </div>
                        </div>
                    )}

                    <button
                        onClick={scrollToTop}
                        className="fixed bottom-6 right-6 z-40 bg-red-600 text-white p-4 rounded-full shadow-2xl active:scale-90 border-2 border-white/20"
                    >
                        <Icon name="ArrowUp" className="w-6 h-6" />
                    </button>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
